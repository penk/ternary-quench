[project]
name = "ternary-quench"
version = "0.1.0"
description = "CAT-Q-inspired ternary calibration for Qwen3"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Penk Chen", email = "penkia@gmail.com" }]
dependencies = [
  "datasets==5.0.1",
  "numpy==2.4.6",
  "safetensors==0.8.0",
  "torch==2.13.0",
  "transformers==5.15.0",
]

[project.optional-dependencies]
mlx = [
  "mlx==0.32.0; sys_platform == 'darwin'",
  "mlx-lm==0.31.3; sys_platform == 'darwin'",
]
test = ["pytest>=8"]

[project.scripts]
ternary-quench = "ternary_quench.train:main"
ternary-quench-export-mlx = "ternary_quench.export_mlx:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ternary_quench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
