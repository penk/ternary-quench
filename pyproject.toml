[project]
name = "ternary-quench"
version = "0.2.0"
description = "CAT-Q-style ternary quantization for Qwen models"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
authors = [{ name = "Penk Chen", email = "penkia@gmail.com" }]
dependencies = [
  "datasets>=3.0.0",
  "fla-core==0.5.2; sys_platform == 'linux'",
  "huggingface-hub>=1.5.0,<2.0",
  "jsonschema>=4.20",
  "numpy>=1.26,<2",
  "safetensors>=0.5",
  "torch==2.7.1",
  "torchvision==0.22.1",
  "transformers @ git+https://github.com/huggingface/transformers.git@a353632607c59463e6ced86a44c2de3c2cd62d5e",
]

[project.optional-dependencies]
eval = ["accelerate>=0.30,<2", "lm-eval==0.4.7"]
gguf = [
  "protobuf>=4.21,<5",
  "requests>=2.31,<3",
  "sentencepiece>=0.1.98,<0.3",
]
mlx = [
  "lm-eval==0.4.7; sys_platform == 'darwin'",
  "mlx>=0.32; sys_platform == 'darwin'",
  "mlx-lm>=0.31; sys_platform == 'darwin'",
]
test = ["pytest>=8"]

[project.scripts]
ternary-quench-profile = "ternary_quench.performance:main"
ternary-quench = "ternary_quench.train:main"
ternary-quench-generate = "ternary_quench.generate_traces:main"
ternary-quench-build-calibration = "ternary_quench.build_calibration:main"
ternary-quench-export-mlx = "ternary_quench.export_mlx:main"
ternary-quench-export-gguf = "ternary_quench.export_gguf:main"
ternary-quench-repack-gguf = "ternary_quench.repack_gguf:main"
ternary-quench-smoke = "ternary_quench.smoke_runtime:main"
ternary-quench-evaluate = "ternary_quench.evaluate_avg5:main"
ternary-quench-evaluate-mlx = "ternary_quench.evaluate_avg5_mlx:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ternary_quench"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
